<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Better Wordle</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Quicksand:wght@400;600;700&display=swap');
      body {
        font-family: 'Quicksand', sans-serif;
      }
      .kawaii-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .kawaii-scroll::-webkit-scrollbar-track {
        background: #e7e5e4;
      }
      .dark .kawaii-scroll::-webkit-scrollbar-track {
        background: #0f172a;
      }
      @keyframes slide-down {
        from { transform: translateY(-110%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-down { animation: slide-down 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
      .kawaii-scroll::-webkit-scrollbar-thumb {
        background: #db2777; 
        border-radius: 4px;
      }
    </style>
